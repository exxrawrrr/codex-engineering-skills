name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate skill suite
        shell: pwsh
        run: ./validate.ps1 -SkillsRoot ./skills
      - name: Validate Phase 01 baseline lock
        shell: pwsh
        run: ./tests/baseline-lock.ps1
      - name: Validate text-hygiene fixtures
        shell: pwsh
        run: ./tests/text-hygiene.ps1
      - name: Prove registry negative fixtures
        shell: pwsh
        run: ./tests/validator-fixtures.ps1
      - name: Validate static validator contract
        shell: pwsh
        run: ./tests/static-validator-contract.ps1
      - name: Validate evidence model contract
        shell: pwsh
        run: ./tests/evidence-model-contract.ps1
      - name: Validate behavioral evaluation records
        shell: pwsh
        run: ./tests/evaluation-harness.ps1
      - name: Validate behavioral evaluation contract
        shell: pwsh
        run: ./tests/evaluation-harness-contract.ps1
      - name: Measure selective-loading context
        shell: pwsh
        run: ./tests/context-benchmark.ps1
      - name: Validate context benchmark contract
        shell: pwsh
        run: ./tests/context-benchmark-contract.ps1
      - name: Validate router selection contract
        shell: pwsh
        run: ./tests/router-evaluation.ps1
      - name: Validate GrowthOps observational case study
        shell: pwsh
        run: ./tests/growthops-case-study.ps1
      - name: Validate installer selection and backup root
        shell: pwsh
        run: ./tests/installer-selection.ps1
      - name: Validate installer staging rollback and idempotency
        shell: pwsh
        run: ./tests/installer-transaction.ps1
      - name: Validate compatibility claims
        shell: pwsh
        run: ./tests/compatibility-contract.ps1
      - name: Validate provenance mappings
        shell: pwsh
        run: ./tests/provenance-contract.ps1
