name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate skill suite
        shell: pwsh
        run: .\validate.ps1 -SkillsRoot .\skills
      - name: Prove text-hygiene negative fixture
        shell: pwsh
        run: .\validate.ps1 -ExpectTextHygieneFailurePath .\evidence\fixtures\validation\mojibake-sample.txt
      - name: Prove registry negative fixtures
        shell: pwsh
        run: .\tests\validator-fixtures.ps1
