name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Report PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -ne "Core") {
            throw "CI requires PowerShell Core (pwsh); observed $($PSVersionTable.PSEdition)"
          }
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "CI requires PowerShell 7+; observed $($PSVersionTable.PSVersion)"
          }
          $runtime = "CI_RUNTIME OS=$env:RUNNER_OS PSEdition=$($PSVersionTable.PSEdition) PowerShell=$($PSVersionTable.PSVersion) Runner=$env:RUNNER_NAME"
          Write-Output $runtime
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### PowerShell runtime"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $runtime
          }
      - name: Validate CI workflow contract
        shell: pwsh
        run: ./tests/ci-workflow-contract.ps1
      - name: Validate skill suite
        shell: pwsh
        run: ./validate.ps1 -SkillsRoot ./skills
      - name: Validate Phase 01 baseline lock
        shell: pwsh
        run: ./tests/baseline-lock.ps1
      - name: Validate text-hygiene fixtures
        shell: pwsh
        run: ./tests/text-hygiene.ps1
      - name: Prove registry negative fixtures
        shell: pwsh
        run: ./tests/validator-fixtures.ps1
      - name: Validate static validator contract
        shell: pwsh
        run: ./tests/static-validator-contract.ps1
      - name: Validate evidence model contract
        shell: pwsh
        run: ./tests/evidence-model-contract.ps1
      - name: Validate behavioral evaluation records
        shell: pwsh
        run: ./tests/evaluation-harness.ps1
      - name: Validate behavioral evaluation contract
        shell: pwsh
        run: ./tests/evaluation-harness-contract.ps1
      - name: Measure selective-loading context
        shell: pwsh
        run: ./tests/context-benchmark.ps1
      - name: Validate context benchmark contract
        shell: pwsh
        run: ./tests/context-benchmark-contract.ps1
      - name: Validate router selection contract
        shell: pwsh
        run: ./tests/router-evaluation.ps1
      - name: Validate router selection negative contracts
        shell: pwsh
        run: ./tests/router-evaluation-contract.ps1
      - name: Validate GrowthOps observational case study
        shell: pwsh
        run: ./tests/growthops-case-study.ps1
      - name: Validate GrowthOps case-study negative contracts
        shell: pwsh
        run: ./tests/growthops-case-study-contract.ps1
      - name: Validate installer selection and backup root
        shell: pwsh
        run: ./tests/installer-selection.ps1
      - name: Validate installer staging rollback and idempotency
        shell: pwsh
        run: ./tests/installer-transaction.ps1
      - name: Validate compatibility claims
        shell: pwsh
        run: ./tests/compatibility-contract.ps1
      - name: Validate compatibility overclaim fixtures
        shell: pwsh
        run: ./tests/compatibility-contract-fixtures.ps1
      - name: Validate provenance mappings
        shell: pwsh
        run: ./tests/provenance-contract.ps1
      - name: Validate provenance maintenance fixtures
        shell: pwsh
        run: ./tests/provenance-contract-fixtures.ps1
      - name: Validate Wave A incubation decisions
        shell: pwsh
        run: ./tests/wave-a-incubation-contract.ps1
      - name: Validate Wave A incubation fixtures
        shell: pwsh
        run: ./tests/wave-a-incubation-contract-fixtures.ps1
      - name: Validate Wave B admission decisions
        shell: pwsh
        run: ./tests/wave-b-incubation-contract.ps1
      - name: Validate Wave B admission fixtures
        shell: pwsh
        run: ./tests/wave-b-incubation-contract-fixtures.ps1
      - name: Validate Phase 16 lifecycle review
        shell: pwsh
        run: ./tests/phase16-lifecycle-contract.ps1
      - name: Validate Phase 16 lifecycle fixtures
        shell: pwsh
        run: ./tests/phase16-lifecycle-contract-fixtures.ps1
